name: Build ESP32 Firmware

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v1
        
      - name: Install ESP32 Core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          
      - name: Install Libraries
        run: |
          arduino-cli lib install "M5Unified" "M5GFX"
          
      - name: Compile Sketch
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32s3:PartitionScheme=huge_app --output-dir ./build .
          
      - name: Find and Merge Bin Files
        run: |
          pip install esptool
          
          # Ищем файлы в папке сборки
          BOOTLOADER=$(find ./build -name "*.bootloader.bin" | head -n 1)
          PARTITIONS=$(find ./build -name "*.partitions.bin" | head -n 1)
          APP=$(find ./build -name "*.ino.bin" | head -n 1)
          
          # Ищем boot_app0.bin в системной папке ядра ESP32
          BOOT_APP0=$(find ~/.arduino15/packages/esp32 -name "boot_app0.bin" | head -n 1)
          
          # Проверяем, что все файлы найдены (для отладки)
          echo "Bootloader: $BOOTLOADER"
          echo "Partitions: $PARTITIONS"
          echo "Boot App0: $BOOT_APP0"
          echo "App: $APP"
          
          # Склеиваем (используем новые команды без .py и с дефисами)
          esptool merge-bin -o ./build/merged_firmware.bin --flash-mode dio --flash-freq 80m --flash-size 8MB 0x0 $BOOTLOADER 0x8000 $PARTITIONS 0xe000 $BOOT_APP0 0x10000 $APP
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: |
            ./build/merged_firmware.bin
            ./build/*.bin
